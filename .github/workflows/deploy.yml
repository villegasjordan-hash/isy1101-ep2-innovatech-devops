name: Build, Push and Deploy EP2

on:
  push:
    branches: [deploy]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front_despacho
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-despacho:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-despacho:${{ github.sha }}

      - name: Build and push ventas backend image
        uses: docker/build-push-action@v6
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-ventas:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-ventas:${{ github.sha }}

      - name: Build and push despachos backend image
        uses: docker/build-push-action@v6
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-despachos:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-despachos:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ep2.pem
          chmod 600 ~/.ssh/ep2.pem

      - name: Upload backend compose through frontend jump host
        run: |
          ssh -i ~/.ssh/ep2.pem -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/ep2.pem -o StrictHostKeyChecking=no -W %h:%p ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_PUBLIC_IP }}" \
            ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_PRIVATE_IP }} "mkdir -p ~/ep2"

          scp -i ~/.ssh/ep2.pem -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/ep2.pem -o StrictHostKeyChecking=no -W %h:%p ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_PUBLIC_IP }}" \
            deploy/docker-compose.backend.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_PRIVATE_IP }}:~/ep2/docker-compose.backend.yml

      - name: Deploy backend stack
        run: |
          ssh -i ~/.ssh/ep2.pem -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/ep2.pem -o StrictHostKeyChecking=no -W %h:%p ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_PUBLIC_IP }}" \
            ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_PRIVATE_IP }} << 'EOF'
          cd ~/ep2
          cat > .env << ENV
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          ENV
          docker compose --env-file .env -f docker-compose.backend.yml pull
          docker compose --env-file .env -f docker-compose.backend.yml up -d
          docker exec mysql-ep2 mysql -uroot -p${{ secrets.MYSQL_ROOT_PASSWORD }} -e "ALTER USER '${{ secrets.MYSQL_USER }}'@'%' IDENTIFIED WITH mysql_native_password BY '${{ secrets.MYSQL_PASSWORD }}'; FLUSH PRIVILEGES;"
          docker restart backend-ventas backend-despachos
          sleep 25
          docker ps
          EOF

      - name: Upload frontend compose
        run: |
          ssh -i ~/.ssh/ep2.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_PUBLIC_IP }} "mkdir -p ~/ep2"

          scp -i ~/.ssh/ep2.pem -o StrictHostKeyChecking=no \
            deploy/docker-compose.frontend.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_PUBLIC_IP }}:~/ep2/docker-compose.frontend.yml

      - name: Deploy frontend stack
        run: |
          ssh -i ~/.ssh/ep2.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_PUBLIC_IP }} << 'EOF'
          cd ~/ep2
          cat > .env << ENV
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          BACKEND_HOST=${{ secrets.BACKEND_PRIVATE_IP }}
          ENV
          docker compose --env-file .env -f docker-compose.frontend.yml pull
          docker compose --env-file .env -f docker-compose.frontend.yml up -d
          docker ps
          EOF
